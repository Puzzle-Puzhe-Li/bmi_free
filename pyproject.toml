[project]
name = "bmi_free"
version = "0.1.0"
description = "ECoG-based brain-machine interface: decoding, visualization, and analysis"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "griffe>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]